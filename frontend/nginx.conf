server {
    # Listen on port 80 (standard HTTP port inside the container)
    listen 80;

    # Serve files from the default Nginx directory
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is CRITICAL for Single Page Applications (SPAs) like React.
        # If Nginx can't find a file matching the URL, it returns index.html,
        # allowing React Router (if used) to handle the routing in the browser.
        try_files $uri $uri/ /index.html;
    }

    # Custom error page configuration
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
