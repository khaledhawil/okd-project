version: '3.8'

services:
  # 1. Database Service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Auth Service (Login / Signup / JWT)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_NAME: taskdb
      DB_USER: devops_user
      DB_PASSWORD: devops_password
      JWT_SECRET: mySecretKey123456789012345678901234
    depends_on:
      - postgres

  # 3. Java Backend Service (Tasks / Projects API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: taskdb
      DB_USER: devops_user
      DB_PASSWORD: devops_password
      JWT_SECRET: mySecretKey123456789012345678901234
    depends_on:
      - postgres

  # 4. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - auth-service

volumes:
  postgres_data:
