version: '3.8'

# This file is for local testing before pushing to GitLab/OKD.
# Run 'docker-compose up --build' in this directory to start the whole stack.

services:
  # 1. Database Service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Java Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # These variables override the default ones in application.yml
      DB_HOST: postgres
      DB_NAME: taskdb
      DB_USER: devops_user
      DB_PASSWORD: devops_password
    depends_on:
      - postgres # Wait for postgres container to start before starting backend

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Map container port 80 (nginx) to local port 3000
    # Note: The React app automatically detects the backend URL using the browser's
    # hostname (e.g., http://192.168.1.222:8080/api/tasks). No env var needed.
    depends_on:
      - backend

# Named volume to persist database data even if the container is deleted
volumes:
  postgres_data:
