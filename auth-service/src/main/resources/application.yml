# ==============================================================================
# Auth Service Application Configuration
# ==============================================================================
# This configuration file defines server settings, database connection properties,
# JPA/Hibernate parameters, and JWT authentication token configurations.
# Environment variables are supported with sensible defaults for local development.

server:
  # HTTP port on which the auth service listens
  port: 8090

spring:
  application:
    # Microservice identification name
    name: auth-service

  datasource:
    # PostgreSQL JDBC connection URL connecting to the shared taskdb database
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:taskdb}
    # Database credentials with environment variable overrides
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Automatically update the database schema based on JPA entity annotations
      ddl-auto: update
    # Print SQL statements to the console for debugging
    show-sql: true
    properties:
      hibernate:
        # PostgreSQL dialect for Hibernate SQL generation
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Secret key used for signing and verifying JSON Web Tokens (HMAC-SHA).
  # Shared between auth-service and downstream services (e.g., backend task-manager).
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234}
  # Token expiration duration in milliseconds (86400000 ms = 24 hours)
  expiration: 86400000
