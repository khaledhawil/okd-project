# Unique identifier for this project in SonarQube
sonar.projectKey=task-manager-backend
# Display name in the SonarQube dashboard
sonar.projectName=Task Manager Backend

# Define where the Java source code is located
sonar.sources=src/main/java
# Define where the unit tests are located
sonar.tests=src/test/java

# Specify the language
sonar.language=java
sonar.java.binaries=target/classes

# Point SonarQube to the Jacoco test coverage report generated by Maven
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
