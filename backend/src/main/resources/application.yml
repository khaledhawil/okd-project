# Server configuration
server:
  port: 8080 # The backend will listen on port 8080

# Spring application name
spring:
  application:
    name: task-manager-backend

  # Database configuration
  datasource:
    # Use environment variables so we can inject them via OKD or docker-compose
    # Default to localhost if DB_HOST is not provided (useful for local development without docker)
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:taskdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate configuration
  jpa:
    hibernate:
      # 'update' automatically creates/updates database tables based on our Java Entity models.
      # Note: In real production, 'validate' is preferred along with tools like Flyway or Liquibase.
      ddl-auto: update
    show-sql: true # Prints SQL queries to the console for debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
